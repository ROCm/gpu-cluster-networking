# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.10"
  jobs:
    post_checkout:
      # Monorepo guard: cancel the build unless this change touched docs/
      # Fetch develop's history (not just its tip) so the common ancestor with
      # this branch is reachable, then review every commit since that ancestor.
      - git fetch origin develop || true
      - |
        if [ "$READTHEDOCS_VERSION_TYPE" = "external" ]; then
          BASE=$(git merge-base origin/develop HEAD || true)   # PR build: compare against the develop base
        else
          BASE=$(git rev-parse HEAD^ || true)                  # branch/latest build: compare against previous commit
        fi
        # Fail open: if no base is found, build rather than risk cancelling wrongly.
        if [ -n "$BASE" ] && git diff --quiet "$BASE" HEAD -- docs/; then
          exit 183
        fi
python:
  install:
  - requirements: docs/sphinx/requirements.txt

sphinx:
  configuration: docs/conf.py

formats: [htmlzip]
